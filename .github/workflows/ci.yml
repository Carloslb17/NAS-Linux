name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 1 checkout repository
        uses: actions/checkout@v3

      - name: 2 install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io samba ufw

      - name: 3 start services
        run: |
          mkdir -p logs scripts /srv/nas/backups /srv/nas/snapshots
          touch logs/install.log logs/backup.log logs/alerts.log
          touch scripts/health_check.sh scripts/backup.sh scripts/create_snapshot.sh
          touch /srv/nas/backups/test.bak /srv/nas/snapshots/latest
          
          sudo systemctl start docker
          sudo systemctl start smbd
          
          docker run -d --name nextcloud --restart always -p 8080:80 mendhak/http-https-echo
          docker run -d --name jellyfin --restart always -p 8096:80 mendhak/http-https-echo
          docker run -d --name grafana --restart always -p 3000:80 mendhak/http-https-echo
          docker run -d --name prometheus --restart always -p 9090:80 mendhak/http-https-echo
          docker run -d --name portainer --restart always -p 9000:80 mendhak/http-https-echo

      - name: 4 run tests
        run: |
          chmod +x run_all_tests.sh tests/*.sh
          ./run_all_tests.sh || exit 1

      - name: 5 report results
        if: always()
        run: |
          echo "Test output:"
          cat logs/tests.log || true
