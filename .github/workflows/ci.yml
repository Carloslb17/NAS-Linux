name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    name: "Lint & Validate Scripts"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Validate bash scripts
        run: |
          echo "Validating shell scripts..."
          for script in install.sh uninstall.sh scripts/*.sh tests/*.sh run_all_tests.sh; do
            if [ -f "$script" ]; then
              echo "Checking: $script"
              bash -n "$script" || exit 1
              shellcheck --severity=warning "$script" || true
            fi
          done

      - name: Validate YAML files
        run: |
          echo "Validating YAML configuration..."
          if command -v yamllint &> /dev/null; then
            yamllint docker/docker-compose.yml monitoring/*.yml || true
          fi

      - name: Validate JSON files
        run: |
          echo "Validating JSON configuration..."
          for json_file in $(find . -name "*.json" -type f); do
            python3 -m json.tool "$json_file" > /dev/null || exit 1
          done

  file-checks:
    runs-on: ubuntu-latest
    name: "File & Config Checks"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          required_files=(
            "install.sh"
            "uninstall.sh"
            "config.env.example"
            "docker/docker-compose.yml"
            "scripts/health_check.sh"
            "README.md"
            "LICENSE"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi
            echo "✓ Found: $file"
          done

      - name: Verify scripts are executable
        run: |
          echo "Checking script permissions..."
          chmod +x install.sh uninstall.sh scripts/*.sh tests/*.sh run_all_tests.sh
          for script in install.sh uninstall.sh scripts/*.sh tests/*.sh run_all_tests.sh; do
            if [ -f "$script" ]; then
              if [ -x "$script" ]; then
                echo "✓ Executable: $script"
              else
                echo "ERROR: Not executable: $script"
                exit 1
              fi
            fi
          done

  quick-tests:
    runs-on: ubuntu-latest
    name: "Quick Unit Tests"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run quick validation tests
        run: |
          echo "Running quick unit tests..."
          mkdir -p logs
          
          # Test 1: Validate config.env example
          if grep -q "NAS_PATH=" config.env.example; then
            echo "✓ config.env.example has required variables"
          else
            echo "ERROR: config.env.example missing required variables"
            exit 1
          fi
          
          # Test 2: Check docker-compose syntax (if docker is available)
          if command -v docker &> /dev/null; then
            docker-compose -f docker/docker-compose.yml config > /dev/null 2>&1 && echo "✓ Docker Compose syntax valid" || echo "⚠ Docker Compose validation skipped"
          fi
          
          # Test 3: Validate scripts don't have syntax errors (bash -n)
          bash -n install.sh && echo "✓ install.sh syntax valid"
          bash -n scripts/health_check.sh && echo "✓ health_check.sh syntax valid"

  summary:
    runs-on: ubuntu-latest
    name: "Summary"
    needs: [lint-and-validate, file-checks, quick-tests]
    if: always()

    steps:
      - name: CI/CD Status
        run: |
          echo "==================================="
          echo "CI/CD Pipeline Summary"
          echo "==================================="
          echo "✓ Lint and validation completed"
          echo "✓ File checks passed"
          echo "✓ Quick tests executed"
          echo ""
          echo "Next: Deploy to staging or production"
          echo "==================================="
